name: Derivative Momentum Engine
on:
  push:
    paths:
      - "derivative-momentum/**"
      - ".github/workflows/derivative-momentum.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or backtest"
        required: true
        default: "backtest"
        type: choice
        options: [scan, backtest]
      start:
        description: "Backtest start (YYYY-MM-DD)"
        required: true
        default: "2024-01-01"
      end:
        description: "End date (YYYY-MM-DD; blank not allowed in manual UI, use today's date)"
        required: true
        default: "2026-10-26"
  schedule:
    - cron: "30 12 * * 1-5"
permissions:
  contents: read
  actions: read
concurrency:
  group: derivative-momentum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: derivative-momentum/requirements.txt
      - name: Install dependencies
        run: pip install -r derivative-momentum/requirements.txt
      - name: Syntax validation
        working-directory: derivative-momentum
        run: python -m compileall -q engine.py
      - name: Run engine
        working-directory: derivative-momentum
        env:
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'backtest' || 'scan') }}
          START_DATE: ${{ inputs.start || '2024-01-01' }}
          END_DATE: ${{ inputs.end || '' }}
        run: |
          if [ "$MODE" = "backtest" ]; then
            python engine.py --mode backtest --start "$START_DATE" --end "${END_DATE:-$(date -u +%F)}" --out output
          else
            python engine.py --mode scan --lookback 300 --out output
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derivative-momentum-results
          path: derivative-momentum/output/
          if-no-files-found: warn
          retention-days: 30
